name: Collect

# Once a day at 10:17 in Japan, just after the sales that start at 10:00 (decision 12).
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

# Two runs at once would break Rakuten's limit of one request a second.
concurrency:
  group: collect
  cancel-in-progress: false

env:
  PAGES: 2

jobs:
  # Extract: Rakuten's responses, unchanged, to R2.
  collect:
    runs-on: ubuntu-latest
    outputs:
      started_at: ${{ steps.start.outputs.ms }}
      key: ${{ steps.upload.outputs.key }}
      uploaded: ${{ steps.upload.outcome }}
    steps:
      # Every deal this run refreshes is fetched after this moment; the load clears the rest.
      - id: start
        run: echo "ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect from Rakuten
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python collector/rakuten.py --categories collector/categories.json --pages "$PAGES"
      # Runs even when the collect step failed, so a partial file is still loaded.
      - name: Upload the raw file to R2
        id: upload
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not support the checksums newer AWS CLI versions add by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          file=$(find collector/out/raw -name '*.ndjson' 2>/dev/null | head -n 1)
          if [ -z "$file" ]; then
            echo 'Nothing was collected.'
            exit 0
          fi
          key=${file#collector/out/}
          aws s3 cp "$file" "s3://$R2_BUCKET/$key" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          echo "key=$key" >> "$GITHUB_OUTPUT"

  # Transform and load: the raw file from R2, into D1. Runs when collecting failed too, so the
  # prices it did not refresh are still cleared (decision 6). Skipped when the upload failed, so a
  # good file that never reached R2 does not clear every deal.
  load:
    needs: collect
    if: ${{ !cancelled() && needs.collect.outputs.uploaded == 'success' }}
    runs-on: ubuntu-latest
    env:
      KEY: ${{ needs.collect.outputs.key }}
      STARTED_AT: ${{ needs.collect.outputs.started_at }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the raw file from R2
        if: env.KEY != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp "s3://$R2_BUCKET/$KEY" "collector/out/$KEY" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
      - name: Normalize into SQL
        run: python collector/normalize.py --cutoff "$STARTED_AT" ${KEY:+"collector/out/$KEY"} > load.sql
      # D1 runs the file as one: if any statement fails, nothing changes.
      - name: Load into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: npx wrangler d1 execute DB --remote --file load.sql --yes
      # Raw files hold prices, which may be kept a day (decision 6). Only this run's file stays.
      - name: Delete older raw files from R2
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 rm "s3://$R2_BUCKET/raw/rakuten/" --recursive --exclude "${KEY#raw/rakuten/}" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
