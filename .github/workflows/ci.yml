name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

  # Every merge to main is deployed (docs/decisions.md, decision 2).
  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    # One deploy at a time, in merge order. A running deploy is never cancelled part-way.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Migrations go first. If one fails the job stops here and the old Worker keeps running.
      - run: npm run db:migrate:remote
      - run: npm run deploy
